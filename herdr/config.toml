onboarding = false
[ui]
# "spaces" bắt buộc cho tree: plugin sidebar-tree tính ├ └ theo đúng thứ tự này
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
# Sidebar rộng hơn chút để tên task không bị cắt
sidebar_width = 34
sidebar_max_width = 44
# Spaces: mỗi space 1 dòng; branch main/master ẩn đi, branch khác hiện mờ cạnh tên
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace",
   { token = "branch", dim = true, rules = [{ equals = "main", hide = true }, { equals = "master", hide = true }] },
   "git_status"],
]

# Agents dạng tree, token do plugin sidebar-tree (dotfiles/herdr/plugins) cấp:
#   $tree_head = tên space, chỉ ở agent đầu nhóm | $tree_line = "├ ◐ title" / "└ ○ title"
# Màu theo icon trạng thái trong dòng: ▲ blocked = đỏ hồng | ◐◑◒◓ working = cam | ✓ done = xanh | ○ idle = xám sáng
# Nếu watcher chết thì agent mới không hiện: chạy action "Restart sidebar tree".
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$tree_head", fg = "#7aa2f7", bold = true, dim = false }],
  [{ token = "$tree_line", fg = "#a9b1d6", bold = false, dim = false, rules = [
      { contains = "▲", fg = "#f7768e", bold = true },
      { contains = "◐", fg = "#ff9e64", bold = true }, { contains = "◑", fg = "#ff9e64", bold = true },
      { contains = "◒", fg = "#ff9e64", bold = true }, { contains = "◓", fg = "#ff9e64", bold = true },
      { contains = "✓", fg = "#9ece6a" },
  ] }],
]

[ui.toast]
delivery = "terminal"

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
# Sidebar tối hơn vùng terminal để có ranh giới; dòng agent đang focus nổi hẳn
sidebar_bg = "#16161e"
active_row_bg = "#292e42"

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
