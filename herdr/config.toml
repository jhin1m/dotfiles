onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[theme]
name = "rose-pine"
auto_switch = false

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
